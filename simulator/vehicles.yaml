# ═══════════════════════════════════════════════════════════════════════════
#  DEFECT CLUSTER — the ground truth Slide 4 must rediscover from data.
#  Do NOT let the RCA agent read this. It exists so you can verify the
#  clustering found the right answer.
# ═══════════════════════════════════════════════════════════════════════════
#  The statistics below are what backend/app/db/history_seed.py actually
#  generates and app/rca/cluster.py actually computes — verified, not aspirational.
#  Earlier values (5 failures / 8.0% / 3.81x) were internally inconsistent:
#  8.0% of 40 is 3.2 vehicles, and a 3.8x lift on a 40-unit lot is too weak to
#  survive multiple-comparison correction across the ~45 cohorts screened.
ground_truth_cluster:
  cluster_key: "water_pump | Nashik | BATCH-2024-Q3-WP"
  affected_batch: BATCH-2024-Q3-WP
  batch_size: 40                 # historical units; 46 in-parc incl. 6 demo vehicles
