# ═══════════════════════════════════════════════════════════════════════════
#  AutoSaarthi — Fleet Screenplay
#  Commit #1. The demo is written here BEFORE any code exists.
#  Every number in the final PPT traces back to this file.
#
#  Consumed by: simulator/replay.py  (publishes to MQTT fleet/{vin}/telemetry)
#               backend/app/db/seed.py (seeds vehicles, customers, history)
# ═══════════════════════════════════════════════════════════════════════════

meta:
  fleet_name: "Hero + M&M Aftersales Pilot Fleet"
  tick_hz: 1                    # 1 telemetry row per second per vehicle
  compression: 43200            # 1 real second = 12 simulated hours
                                # → a 6-day degradation arc plays in ~12 seconds
  seed: 42

# ───────────────────────────────────────────────────────────────────────────
# Signal envelope — nominal ranges + physical limits.
# Feature names match the Kaggle "Automotive Vehicles Engine Health" schema
# so models train on real data and score on simulated data unchanged.
# ───────────────────────────────────────────────────────────────────────────
signals:
  engine_rpm:        { unit: rpm,   nominal: [700, 3200],  hard: [0, 6500],  noise: 45 }
  coolant_temp:      { unit: C,     nominal: [82, 96],     hard: [-10, 130], noise: 0.6 }
  lub_oil_pressure:  { unit: bar,   nominal: [2.6, 4.2],   hard: [0, 7],     noise: 0.08 }
  lub_oil_temp:      { unit: C,     nominal: [75, 105],    hard: [-10, 150], noise: 0.8 }
  fuel_pressure:     { unit: bar,   nominal: [3.0, 6.5],   hard: [0, 12],    noise: 0.15 }
  battery_voltage:   { unit: V,     nominal: [13.6, 14.4], hard: [8, 16],    noise: 0.05 }
  tyre_pressure:     { unit: psi,   nominal: [30, 34],     hard: [0, 50],    noise: 0.2 }
  brake_fluid_pct:   { unit: pct,   nominal: [85, 100],    hard: [0, 100],   noise: 0.1 }
  speed:             { unit: kmph,  nominal: [0, 90],      hard: [0, 180],   noise: 2.0 }
  ambient_temp:      { unit: C,     nominal: [22, 41],     hard: [-5, 52],   noise: 0.4 }
  # Added for broader OBD-II Mode 01 PID coverage — standard PIDs a generic
  # ELM327 dongle reads on any BS6 car (India mandated OBD-II from 1 Apr 2020),
  # beyond the original Kaggle-matched set above. Same nominal/hard/noise model,
  # no new physics — see the note on tick()'s ignition-off collapse for the one
  # place these need different handling than the signals above.
  throttle_position: { unit: pct,   nominal: [8, 45],      hard: [0, 100],   noise: 3.0 }
  intake_air_temp:   { unit: C,     nominal: [20, 45],     hard: [-10, 70],  noise: 0.5 }
  maf_rate:          { unit: g/s,   nominal: [3, 25],      hard: [0, 200],   noise: 1.2 }
  engine_load:       { unit: pct,   nominal: [20, 55],     hard: [0, 100],   noise: 4.0 }
  intake_manifold_pressure: { unit: kPa, nominal: [30, 60], hard: [10, 105], noise: 1.5 }

# ───────────────────────────────────────────────────────────────────────────
# Vehicle-state signals — NOT predictive features. These exist so the in-car
# console (see PROJECT_PLAN §2A) knows what it is allowed to put on screen.
# The SERVER derives drive_state from these and tells the console; the client
# never decides for itself that it is safe to show a booking screen.
# ───────────────────────────────────────────────────────────────────────────
state_signals:
  ignition:          { type: enum, values: [off, acc, on, cranking] }
  gear:              { type: enum, values: [P, R, N, D, S, L] }
  park_brake:        { type: bool }
  occupant_present:  { type: bool }
  seatbelt_driver:   { type: bool }
  ambient_lux:       { unit: lux,  nominal: [0, 90000] }   # drives day/night theme

# Server-side derivation. Order matters — first match wins.
drive_state_rules:
  - state: IGNITION_OFF
    when: "ignition in [off, acc]"
    console: dark
    agent_channel: phone_call            # fall back to outbound voice call
  - state: PARKED
    when: "speed < 1 and (park_brake or gear == 'P')"
    console: full
    agent_channel: console_voice
    allows: [touch, slot_selection, feedback_survey, service_history]
  - state: STOPPED_BRIEF
    when: "speed < 1"                    # stationary but in gear — traffic light
    console: locked
    agent_channel: console_voice
    allows: [voice_only]
    note: "Treated as DRIVING. Do not tempt the driver at a red light."
  - state: DRIVING
    when: "speed >= 1"
    console: locked
    agent_channel: console_voice
    allows: [voice_only]
    max_elements_on_screen: 1

# ───────────────────────────────────────────────────────────────────────────
# Drive cycles — shape the signal envelope by how the vehicle is actually used.
# ───────────────────────────────────────────────────────────────────────────
drive_cycles:
  highway_taxi:   { duty: 0.78, avg_speed: 68, stop_start_per_hr: 4,  load: high }
  city_commute:   { duty: 0.35, avg_speed: 22, stop_start_per_hr: 38, load: medium }
  urban_delivery: { duty: 0.62, avg_speed: 18, stop_start_per_hr: 61, load: high }
  weekend_leisure: { duty: 0.09, avg_speed: 44, stop_start_per_hr: 12, load: low }
  mixed_fleet:    { duty: 0.55, avg_speed: 41, stop_start_per_hr: 24, load: medium }

# ───────────────────────────────────────────────────────────────────────────
# Degradation templates — how a component fails, as a signal trajectory.
# `driver` signals ramp; `dtc_at` fires a trouble code once progress crosses it.
# ───────────────────────────────────────────────────────────────────────────
degradations:

  water_pump_impeller_wear:
    component: water_pump
    safety_critical: true
    # 26, not 9: days_to_failure = horizon_days x (1 - progress), and all five
    # vehicles on this arc have expected_prediction values implying a horizon of
    # 22-32 days. At 9 the hero sits ~3 days out and scores P1, contradicting its
    # own scripted "9 days / P2". The 9 appears to have been copied from the
    # hero's expected days-remaining.
    horizon_days: 26
    drivers:
      coolant_temp:     { mode: ramp,      from: 0.0,  to: +14.0, curve: exponential }
      lub_oil_temp:     { mode: ramp,      from: 0.0,  to: +9.0,  curve: exponential }
      engine_rpm:       { mode: variance,  factor: 1.35 }
    dtc_at:
      0.55: ["P0128"]   # Coolant thermostat below regulating temperature
      0.80: ["P0217"]   # Engine over-temperature condition
    failure_mode: "Impeller seal degradation → reduced coolant flow → overheat"
    repair: { cost_inr: 2400, bay_minutes: 90, parts: ["water_pump_assy", "coolant_5l"] }
    breakdown_cost_inr: 18500     # tow + possible head gasket
    known_capa: "CAPA-2023-0871"

  battery_sulphation:
    component: battery
    safety_critical: false
    horizon_days: 21
    drivers:
      battery_voltage:  { mode: ramp, from: 0.0, to: -1.4, curve: linear }
    dtc_at:
      0.70: ["P0562"]   # System voltage low
    failure_mode: "Plate sulphation from chronic short-trip undercharging"
    repair: { cost_inr: 5200, bay_minutes: 30, parts: ["battery_65ah"] }
    breakdown_cost_inr: 9000

  brake_pad_wear:
    component: brake_pads
    safety_critical: true
    horizon_days: 14
    drivers:
      brake_fluid_pct:  { mode: ramp, from: 0.0, to: -22.0, curve: linear }
    dtc_at:
      0.85: ["C1201"]
    failure_mode: "Friction material below 3mm — stopping distance degradation"
    repair: { cost_inr: 3100, bay_minutes: 60, parts: ["brake_pad_set_front"] }
    breakdown_cost_inr: 22000

  injector_fouling:
    component: fuel_injector
    safety_critical: false
    horizon_days: 26
    drivers:
      fuel_pressure:    { mode: ramp,     from: 0.0, to: -1.1, curve: logarithmic }
      engine_rpm:       { mode: variance, factor: 1.5 }
    dtc_at:
      0.75: ["P0171"]   # System too lean
    failure_mode: "Carbon deposit on injector nozzle — lean mixture, misfire risk"
    repair: { cost_inr: 4600, bay_minutes: 120, parts: ["injector_set", "fuel_filter"] }
    breakdown_cost_inr: 14000

  oil_pump_pressure_loss:
    component: oil_pump
    safety_critical: true
    horizon_days: 6
    drivers:
      lub_oil_pressure: { mode: ramp, from: 0.0, to: -1.6, curve: exponential }
      lub_oil_temp:     { mode: ramp, from: 0.0, to: +11.0, curve: linear }
    dtc_at:
      0.60: ["P0521"]   # Engine oil pressure sensor range/performance
      0.88: ["P0524"]   # Engine oil pressure too low
    failure_mode: "Pump relief valve wear → oil starvation at high RPM"
    repair: { cost_inr: 7800, bay_minutes: 180, parts: ["oil_pump", "oil_5w30_4l"] }
    breakdown_cost_inr: 65000     # seized engine

