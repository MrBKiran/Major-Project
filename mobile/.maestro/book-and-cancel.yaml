# Book the first open slot, see it confirmed, then cancel it.
# The demo data usually starts with a booking the agent made for Aditi; if so it is
# cancelled first (Home hides "Book a service" while a booking stands). Re-seed with
# backend/scripts/reset_demo.py to get it back.
appId: io.autosaarthi.owner
name: Book a service, then cancel it
---
- runFlow:
    file: common/sign-in.yaml
    env:
      EMAIL: aditi.nair@example.in
- extendedWaitUntil:
    visible: "Book a service|Change or cancel"
    timeout: 30000
# Every action on the booking screen ends back on Home.
- runFlow:
    when:
      visible: "Change or cancel"
    commands:
      - tapOn: "Change or cancel"
      - extendedWaitUntil:
          visible: "Booked for .*"
          timeout: 15000
      - tapOn: "Cancel this booking"
      - tapOn: "Yes, cancel it"
      - extendedWaitUntil:
          visible: "Book a service"
          timeout: 15000
- tapOn: "Book a service"
- extendedWaitUntil:
    visible: "Open slots near you"
    timeout: 15000
# The first slot is chosen already; its button sits under the list.
# (A day name, so the header "Book a service" is not matched.)
- scrollUntilVisible:
    element:
      text: "Book (Mon|Tue|Wed|Thu|Fri|Sat|Sun) .*"
    direction: DOWN
- tapOn:
    text: "Book (Mon|Tue|Wed|Thu|Fri|Sat|Sun) .*"
- extendedWaitUntil:
    visible: "Service booked"
    timeout: 15000
- assertNotVisible: "Book a service"
- tapOn: "Change or cancel"
- extendedWaitUntil:
    visible: "Booked for .*"
    timeout: 15000
- tapOn: "Cancel this booking"
- tapOn: "Yes, cancel it"
- extendedWaitUntil:
    visible: "Book a service"
    timeout: 15000
- assertNotVisible: "Service booked"
